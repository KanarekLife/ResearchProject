inference:
  api: openai # openai (chat completions), responses (OpenAI Responses), google (Gemini generateContent) or anthropic (Messages)
  server: http://localhost:1234/v1
  api_key_env: OPENAI_API_KEY
  server_env: "" # variable that overrides server; empty: OPENAI_BASE_URL for openai and responses, none for google and anthropic
  model: ""
  temperature: -1 # -1: not sent, the provider default applies; 0 or more is sent
  max_tokens: 32768
  retries: 3
  reasoning_effort: medium
  reasoning_budget: 2048

player:
  name: model
  max_failures: 5
  instructions_dir: data/instructions
  instructions: [rules_agent, mcbench]

run:
  seeds: 10
  samples: 1
  parallel: 1
  out: results

online: # the git branch every finished run is published to, one directory per run
  remote: origin
  branch: results
  dir: online-results # local checkout of the branch
  publish: true # a run cut short or with an infra_error game is never published
  source: hybrid # what report, analyze, view and board_gui read: local, online or hybrid

scoring:
  win: 0.40
  villain_damage: 0.25
  hero_hp: 0.10
  threat: 0.10
  speed: 0.15
