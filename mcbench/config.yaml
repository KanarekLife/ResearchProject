inference:
  api: openai
  server: http://localhost:1234/v1
  api_key_env: OPENAI_API_KEY
  server_env: OPENAI_BASE_URL
  model: ""
  temperature: -1
  max_tokens: 32768
  retries: 3
  rate_limit_wait: 6h
  reasoning_effort: medium
  reasoning_budget: 2048

player:
  name: model
  max_failures: 5
  instructions_dir: data/instructions
  instructions: [rules_agent, mcbench]

run:
  scenarios: [spider-man-vs-rhino]
  seeds: 10
  samples: 1
  parallel: 1
  out: results

online:
  remote: origin
  branch: results
  dir: online-results
  publish: true
  source: hybrid

jobs:
  branch: jobs
  dir: online-jobs

providers: {}

scoring:
  win: 0.40
  villain_damage: 0.25
  hero_hp: 0.10
  threat: 0.10
  speed: 0.15
