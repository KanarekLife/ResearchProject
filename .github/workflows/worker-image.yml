name: Worker image

# Builds the jobs worker image (mcbench/Dockerfile). A push to main publishes it
# to GHCR, tagged with the commit sha and latest; a pull request only builds it.
on:
  push:
    branches: [main]
    paths: [mcbench/**, .github/workflows/worker-image.yml]
  pull_request:
    paths: [mcbench/**, .github/workflows/worker-image.yml]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/mcbench-worker
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: mcbench
          build-args: COMMIT=${{ github.sha }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
