name: Results

# Rebuilds the site from main: the Pages workflow and its deploy live there.
on:
  push:
    branches: [results]

permissions:
  actions: write

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
